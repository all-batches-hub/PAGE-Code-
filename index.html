<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Webpage HTML Code Generator</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; background: #131b2e; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        h2 { font-size: 18px; margin-bottom: 15px; color: #f59e0b; text-align: center; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #94a3b8; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 9px; background: #0b0f19; border: 1px solid #1e293b; color: #fff; border-radius: 6px; font-size: 13px; font-family: inherit; }
        textarea { height: 70px; resize: vertical; }
        button { width: 100%; background: #f59e0b; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 14px; }
        button:hover { background: #d97706; }
        .btn-copy { background: #10b981; color: #fff; margin-top: 10px; }
        .btn-copy:hover { background: #059669; }
        .output-box { margin-top: 15px; display: none; }
        .output-box textarea { height: 220px; color: #38bdf8; font-family: monospace; font-size: 11px; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Movie Webpage Code Generator</h2>

    <div class="form-group">
        <label>Page Title (Browser Tab Title)</label>
        <input type="text" id="pageTitle" placeholder="Ex: Download Movie Title | AllMoviesHub">
    </div>

    <div class="form-group">
        <label>Main Title (Heading Text)</label>
        <input type="text" id="mainTitle" placeholder="Ex: Download Movie Title | 2026 | Pre-DVDRip">
    </div>

    <div class="row">
        <div class="form-group">
            <label>Poster / Image 1 URL</label>
            <input type="text" id="posterUrl1" placeholder="https://...image1.jpg">
        </div>
        <div class="form-group">
            <label>Poster / Image 2 URL (Optional)</label>
            <input type="text" id="posterUrl2" placeholder="https://...image2.jpg">
        </div>
    </div>

    <!-- Download Links -->
    <div class="row">
        <div class="form-group">
            <label>480p Link</label>
            <input type="text" id="link480" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>480p Size</label>
            <input type="text" id="size480" placeholder="500MB">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>720p Link</label>
            <input type="text" id="link720" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>720p Size</label>
            <input type="text" id="size720" placeholder="1000MB">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>1080p Link</label>
            <input type="text" id="link1080" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>1080p Size</label>
            <input type="text" id="size1080" placeholder="2000MB">
        </div>
    </div>

    <div class="form-group">
        <label>Screenshots URLs (Comma separated)</label>
        <textarea id="screenshots" placeholder="https://...ss1.jpg, https://...ss2.jpg, https://...ss3.jpg, https://...ss4.jpg"></textarea>
    </div>

    <div class="form-group">
        <label>Tags (Comma separated)</label>
        <input type="text" id="tags" placeholder="Gold, silver, methi">
    </div>

    <button onclick="generateFullHtml()">Generate HTML Code</button>

    <div class="output-box" id="outputSection">
        <textarea id="finalHtmlCode" readonly></textarea>
        <button class="btn-copy" id="copyBtn" onclick="copyGeneratedCode()">Copy HTML Code</button>
    </div>
</div>

<script>
function generateFullHtml() {
    const pageTitle = document.getElementById('pageTitle').value.trim() || 'Movie Page';
    const mainTitle = document.getElementById('mainTitle').value.trim() || 'Movie Download Title';
    const poster1 = document.getElementById('posterUrl1').value.trim() || 'https://files.catbox.moe/zs8vht.jpg';
    const poster2 = document.getElementById('posterUrl2').value.trim();

    let postersHtml = `<img src="${poster1}" alt="Poster 1">`;
    if (poster2) {
        postersHtml += `\n            <img src="${poster2}" alt="Poster 2">`;
    }

    const link480 = document.getElementById('link480').value.trim() || '#';
    const size480 = document.getElementById('size480').value.trim() || '500';
    const link720 = document.getElementById('link720').value.trim() || '#';
    const size720 = document.getElementById('size720').value.trim() || '1000';
    const link1080 = document.getElementById('link1080').value.trim() || '#';
    const size1080 = document.getElementById('size1080').value.trim() || '2000';

    const ssInput = document.getElementById('screenshots').value.trim();
    let ssArray = ssInput ? ssInput.split(',').map(s => s.trim()) : [poster1, poster1, poster1, poster1];
    let ssHtml = ssArray.map((url, i) => `<img src="${url}" alt="Screenshot ${i + 1}">`).join('\n            ');

    const tagsInput = document.getElementById('tags').value.trim();
    let tagsArray = tagsInput ? tagsInput.split(',').map(t => t.trim()) : ['Gold', 'silver', 'methi'];
    let tagsHtml = tagsArray.map(tag => `<a href="#" class="tag-item">${tag}</a>`).join('\n            ');

    const fullCode = `<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${pageTitle}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px 10px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; transition: max-width 0.3s ease; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); }
        .poster-wrapper { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-bottom: 20px; }
        .poster-wrapper img { width: 100%; max-width: 350px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); object-fit: cover; }
        h1 { font-size: 1.35rem; color: #38bdf8; text-align: center; line-height: 1.4; }
        h2 { font-size: 1.15rem; color: #ffffff; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .download-title { text-align: center; margin-bottom: 18px; color: var(--accent-yellow); font-size: 1.1rem; letter-spacing: 0.5px; }
        .btn-container { display: flex; flex-direction: column; gap: 14px; }
        .btn-split { display: flex; align-items: center; justify-content: space-between; text-decoration: none; border-radius: 50px; overflow: hidden; font-weight: 1000; font-size: 0.95rem; transition: transform 0.2s ease, box-shadow 0.2s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35); }
        .btn-split:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6); }
        .btn-left { display: flex; align-items: center; gap: 10px; padding: 5px 20px; flex-grow: 1; color: #ffffff; }
        .btn-right { padding: 15px 20px; background: rgba(0, 0, 0, 0.28); color: #ffffff; font-weight: 700; border-left: 1px solid rgba(255, 255, 255, 0.18); }
        .btn-480p { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-720p { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-1080p { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .screenshot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .screenshot-grid img { width: 100%; border-radius: 10px; object-fit: cover; border: 1px solid var(--border-color); }
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-item { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; text-decoration: none; transition: background 0.2s; }
        .tag-item:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .form-group-comm { margin-bottom: 12px; }
        .form-control { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-family: inherit; }
        .form-control:focus { outline: 1px solid #38bdf8; }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .btn-submit { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #1d4ed8; }
        footer { font-size: 0.8rem; color: var(--text-muted); text-align: center; line-height: 1.6; margin-top: 20px; }

        @media (min-width: 768px) {
            .container { max-width: 1000px; }
            .poster-wrapper { flex-direction: row; justify-content: center; gap: 25px; }
            .poster-wrapper img { max-width: 420px; }
            .screenshot-grid { grid-template-columns: repeat(4, 1fr); }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="poster-wrapper">
            ${postersHtml}
        </div>
        <h1>${mainTitle}</h1>
    </div>

    <div class="card">
        <h3 class="download-title">:: DOWNLOAD LINKS ::</h3>
        <div class="btn-container">
            <a href="${link480}" class="btn-split btn-480p">
                <span class="btn-left">📥 <span>Download 480p</span></span>
                <span class="btn-right">${size480}</span>
            </a>
            <a href="${link720}" class="btn-split btn-720p">
                <span class="btn-left">⚡ <span>Download 720p</span></span>
                <span class="btn-right">${size720}</span>
            </a>
            <a href="${link1080}" class="btn-split btn-1080p">
                <span class="btn-left">🚀 <span>Download 1080p</span></span>
                <span class="btn-right">${size1080}</span>
            </a>
        </div>
    </div>

    <div class="card">
        <h2>Screenshots</h2>
        <div class="screenshot-grid">
            ${ssHtml}
        </div>
    </div>

    <div class="card">
        <h2>Tags</h2>
        <div class="tags-container">
            ${tagsHtml}
        </div>
    </div>

    <div class="card">
        <h2>Leave your comment</h2>
        <form>
            <div class="form-group-comm">
                <textarea class="form-control" placeholder="Your comment *"></textarea>
            </div>
            <div class="form-group-comm">
                <input type="text" class="form-control" placeholder="Your Name *">
            </div>
            <button type="submit" class="btn-submit">POST COMMENT</button>
        </form>
    </div>

    <footer>
        <p>AllMoviesHub Official Website – Download latest Bollywood, Hollywood Hindi Dubbed, South Indian Movies & Web Series in multiple formats.</p>
    </footer>
</div>

</body>
</html>`;

    document.getElementById('finalHtmlCode').value = fullCode;
    document.getElementById('outputSection').style.display = 'block';
}

async function copyGeneratedCode() {
    const textCode = document.getElementById('finalHtmlCode');
    textCode.select();
    document.execCommand('copy');
    const btn = document.getElementById('copyBtn');
    btn.innerHTML = "✔️ Copied to Clipboard";
    setTimeout(() => { btn.innerHTML = "Copy HTML Code"; }, 2000);
}
</script>

</body>
    </html>
